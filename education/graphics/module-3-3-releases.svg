<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" width="560" height="344"><title>A release is a checklist, not a choice</title><desc>Seven steps in order: pick the version, make a release branch, verify, open the release pull request, tag main, confirm the release, and close the milestone. A note says to read the version file, not the last tag.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="344" rx="16"/><rect class="paper" x="12" y="22" width="123" height="100" rx="12"/><circle class="tg" cx="28" cy="40" r="11"/><text class="mn mid" x="28" y="45" style="font-size:13px">1</text><text class="lb" x="24" y="74" style="font-size:14px">Pick version</text><text class="sm" x="24" y="94" style="font-size:13px">patch, minor,</text><text class="sm" x="24" y="110" style="font-size:13px">or major</text><path class="arw" d="M137,72 L148,72"/><rect class="paper" x="150" y="22" width="123" height="100" rx="12"/><circle class="tg" cx="166" cy="40" r="11"/><text class="mn mid" x="166" y="45" style="font-size:13px">2</text><text class="lb" x="162" y="74" style="font-size:14px">Make branch</text><text class="sm" x="162" y="94" style="font-size:13px">bump version</text><text class="sm" x="162" y="110" style="font-size:13px">+ changelog</text><path class="arw" d="M275,72 L286,72"/><rect class="paper" x="288" y="22" width="123" height="100" rx="12"/><circle class="tg" cx="304" cy="40" r="11"/><text class="mn mid" x="304" y="45" style="font-size:13px">3</text><text class="lb" x="300" y="74" style="font-size:14px">Verify</text><text class="sm" x="300" y="94" style="font-size:13px">run the full</text><text class="sm" x="300" y="110" style="font-size:13px">test suite</text><path class="arw" d="M413,72 L424,72"/><rect class="paper" x="426" y="22" width="123" height="100" rx="12"/><circle class="tg" cx="442" cy="40" r="11"/><text class="mn mid" x="442" y="45" style="font-size:13px">4</text><text class="lb" x="438" y="74" style="font-size:14px">Release PR</text><text class="sm" x="438" y="94" style="font-size:13px">merge when</text><text class="sm" x="438" y="110" style="font-size:13px">green</text><rect class="paper" x="12" y="134" width="123" height="100" rx="12"/><circle class="tg" cx="28" cy="152" r="11"/><text class="mn mid" x="28" y="157" style="font-size:13px">5</text><text class="lb" x="24" y="186" style="font-size:14px">Tag main</text><text class="sm" x="24" y="206" style="font-size:13px">push the tag</text><path class="arw" d="M137,184 L148,184"/><rect class="paper" x="150" y="134" width="123" height="100" rx="12"/><circle class="tg" cx="166" cy="152" r="11"/><text class="mn mid" x="166" y="157" style="font-size:13px">6</text><text class="lb" x="162" y="186" style="font-size:14px">Confirm</text><text class="sm" x="162" y="206" style="font-size:13px">release + tag</text><text class="sm" x="162" y="222" style="font-size:13px">exist</text><path class="arw" d="M275,184 L286,184"/><rect class="paper" x="288" y="134" width="123" height="100" rx="12"/><circle class="tg" cx="304" cy="152" r="11"/><text class="mn mid" x="304" y="157" style="font-size:13px">7</text><text class="lb" x="300" y="186" style="font-size:14px">Close</text><text class="sm" x="300" y="206" style="font-size:13px">the milestone</text><rect class="ta" x="414" y="134" width="134" height="100" rx="12"/><text class="lb mid" x="481" y="160" style="font-size:14px">Read the</text><text class="lb mid" x="481" y="180" style="font-size:14px">version file,</text><text class="lb mid" x="481" y="200" style="font-size:14px">not the</text><text class="lb mid" x="481" y="220" style="font-size:14px">last tag</text><rect class="tg" x="14" y="264" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="292">A release is a recipe to follow, not a set of</text><text class="bn mid" x="280.0" y="314">choices to weigh.</text></svg>
