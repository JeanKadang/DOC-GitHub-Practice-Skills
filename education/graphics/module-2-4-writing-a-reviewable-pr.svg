<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" width="560" height="396"><title>Show your work</title><desc>A pull request starts with Refs #N for one issue. A table lists each criterion with its evidence and a Met or Unmet result. If any row is Unmet, the pull request keeps Refs.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="396" rx="16"/><rect class="paper" x="12" y="22" width="140" height="206" rx="14"/><rect class="paper" x="56.0" y="45.0" width="52" height="66" rx="6"/><rect class="ln" x="65.0" y="57.0" width="34" height="6" rx="3"/><rect class="ln" x="65.0" y="71.0" width="24" height="6" rx="3"/><rect class="ln" x="65.0" y="85.0" width="34" height="6" rx="3"/><text class="mn mid" x="82" y="140">Refs #N</text><text class="sm mid" x="82" y="170">one issue</text><text class="sm mid" x="82" y="190">per PR</text><rect class="paper" x="164" y="22" width="384" height="206" rx="14"/><text class="mns" x="180" y="50">criterion</text><text class="mns" x="372" y="50">evidence</text><text class="mns" x="480" y="50">result</text><path class="st dash" d="M176,64 H536"/><text class="sm" x="180" y="98" style="font-size:14px">Badge is teal</text><text class="sm" x="372" y="98" style="font-size:13px">screenshot</text><rect class="tg" x="478" y="76" width="58" height="30" rx="15.0"/><text class="mns gtxt mid" x="507.0" y="96.0" style="font-size:13px">Met</text><path class="st dash" d="M176,116 H536"/><text class="sm" x="180" y="150" style="font-size:14px">Unknown role: name</text><text class="sm" x="372" y="150" style="font-size:13px">test, CI run</text><rect class="tg" x="478" y="128" width="58" height="30" rx="15.0"/><text class="mns gtxt mid" x="507.0" y="148.0" style="font-size:13px">Met</text><path class="st dash" d="M176,168 H536"/><text class="sm" x="180" y="202" style="font-size:14px">Docs mention roles</text><text class="sm" x="372" y="202" style="font-size:13px">not done</text><rect class="tr" x="478" y="180" width="58" height="30" rx="15.0"/><text class="mns rtxt mid" x="507.0" y="200.0" style="font-size:13px">Unmet</text><rect class="ta" x="12" y="244" width="536" height="48" rx="12"/><text class="lb mid" x="280" y="274" style="font-size:17px">Any Unmet row: keep Refs, not Closes.</text><rect class="tg" x="14" y="316" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="344">Name the evidence for each criterion. Do not</text><text class="bn mid" x="280.0" y="366">say “tests pass”.</text></svg>
