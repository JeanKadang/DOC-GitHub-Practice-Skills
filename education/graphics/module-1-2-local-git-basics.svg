<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0.0 560 410.0" width="560" height="410.0"><title>Add packs the box. Commit seals it.</title><desc>Three files on a desk. Two are packed into a staging box with git add; the box is sealed and labeled with git commit. The third file stays on the desk.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0.0" width="560" height="410.0" rx="16"/>
    <text class="mns" x="30" y="40">on your desk</text>
    <rect class="paper" x="30" y="56" width="96" height="58" rx="8"/><text class="mn mid" x="78" y="92">a.txt</text>
    <rect class="paper" x="30" y="130" width="96" height="58" rx="8"/><text class="mn mid" x="78" y="166">b.txt</text>
    <rect class="paper dash" x="30" y="204" width="96" height="58" rx="8"/><text class="mn mid" x="78" y="240">c.txt</text>
    <text class="sm" x="30" y="292">c.txt stays behind</text>
    <path class="arw" d="M134,120 H204"/><text class="mns mid" x="169" y="106">git add</text>
    <path class="ta" d="M208,118 h112 v112 h-112z"/>
    <path class="ta" d="M208,118 l14,-24 h84 l14,24"/>
    <rect class="paper" x="228" y="146" width="72" height="26" rx="5"/><text class="mns mid" x="264" y="164">a.txt</text>
    <rect class="paper" x="228" y="182" width="72" height="26" rx="5"/><text class="mns mid" x="264" y="200">b.txt</text>
    <text class="lb mid" x="264" y="262">staging</text><text class="sm mid" x="264" y="284">the next commit</text>
    <path class="arw" d="M328,176 H430"/><text class="mns mid" x="379" y="162">git commit</text>
    <rect class="tg" x="438" y="118" width="102" height="112" rx="6"/>
    <rect class="paper" x="452" y="150" width="74" height="30" rx="6"/><text class="mns mid" x="489" y="170">fix typo</text>
    <path class="st-g" d="M438,146 H540"/>
    <path class="st" d="M424,244 H554"/>
    <text class="lb mid" x="489" y="276">commit</text><text class="sm mid" x="489" y="298">sealed, labeled</text>
  <rect class="tg" x="14" y="352.0" width="532" height="44" rx="12"/><text class="bn mid" x="280.0" y="380.0">Only what you packed goes into the commit.</text></svg>
