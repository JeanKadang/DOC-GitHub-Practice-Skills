<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 458" width="560" height="458"><title>Copilot comments, you decide</title><desc>What Copilot code review does and what you do in return: it leaves a comment review that is never an approval, so you give your own verdict; it labels each comment high, medium or low, so you judge each as right, wrong or missing; it may repeat dismissed comments, so you dismiss once with a reason; and it reads its instructions file from the head branch, so a pull request can change that file and you review it too.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="458" rx="16"/><text class="lb mid" style="font-weight:700" x="132" y="24">Copilot does</text><text class="lb mid" style="font-weight:700" x="428" y="24">You do</text><rect class="paper" x="14" y="40" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="70">Comment review</text><text class="sm mid" x="132" y="94">never an approval</text><rect class="tg" x="310" y="40" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="70">your verdict</text><text class="sm mid" x="428" y="94">yours to decide</text><path class="arw-g" d="M256,76 L304,76"/><rect class="paper" x="14" y="122" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="152">High, medium, low</text><text class="sm mid" x="132" y="176">a severity label</text><rect class="tg" x="310" y="122" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="152">right, wrong, missing</text><text class="sm mid" x="428" y="176">judge each comment</text><path class="arw-g" d="M256,158 L304,158"/><rect class="paper" x="14" y="204" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="234">may repeat comments</text><text class="sm mid" x="132" y="258">after a re-review</text><rect class="tg" x="310" y="204" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="234">dismiss with a reason</text><text class="sm mid" x="428" y="258">once, in a reply</text><path class="arw-g" d="M256,240 L304,240"/><rect class="ta" x="14" y="286" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="316">reads the head branch</text><text class="sm mid" x="132" y="340">its instructions file</text><rect class="ta" x="310" y="286" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="316">review that file too</text><text class="sm mid" x="428" y="340">a PR can change it</text><path class="arw-g" d="M256,322 L304,322"/><rect class="tg" x="14" y="378" width="532" height="66" rx="12"/><text class="bn mid" x="280" y="406">Copilot comments. You decide. Merging is still</text><text class="bn mid" x="280" y="428">the maintainer's call.</text></svg>
