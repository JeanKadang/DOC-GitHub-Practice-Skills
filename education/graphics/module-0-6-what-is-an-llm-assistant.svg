<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" width="560" height="404"><title>Tools and permission decide what it can do</title><desc>Two cards compare an assistant that only writes text with one that uses tools to edit files and run commands. Four chips list what shapes either: instructions, context, tools and permission.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="404" rx="16"/><rect class="paper" x="12" y="24" width="262" height="224" rx="14"/><rect class="paper" x="286" y="24" width="262" height="224" rx="14"/><rect class="paper" x="105.0" y="59.0" width="76" height="46" rx="12"/><path class="paper" d="M119.0,105.0 l-6,12 l18,-12 z"/><rect class="ln" x="117.0" y="71.0" width="52" height="5" rx="2"/><rect class="ln" x="117.0" y="82.0" width="38" height="5" rx="2"/><text class="lbb mid" x="143" y="148">Text only</text><text class="sm mid" x="143" y="176">Writes an answer.</text><text class="sm mid" x="143" y="196">Nothing on disk changes.</text><rect class="paper" x="53" y="210" width="180" height="28" rx="14.0"/><text class="mns  mid" x="143.0" y="229.0">you read it</text><rect class="paper" x="374.0" y="54.0" width="44" height="56" rx="6"/><rect class="ln" x="383.0" y="66.0" width="26" height="6" rx="3"/><rect class="ln" x="383.0" y="80.0" width="16" height="6" rx="3"/><circle class="ta" cx="436" cy="88" r="11"/><circle class="paper" cx="436" cy="88" r="4"/><path class="st-a" d="M447,88 H472 M464,88 v9 M472,88 v7"/><text class="lbb mid" x="417" y="148">Acts with tools</text><text class="sm mid" x="417" y="176" style="font-size:14px">Edits files, runs commands</text><text class="sm mid" x="417" y="196">Only what you permit.</text><rect class="ta" x="327" y="210" width="180" height="28" rx="14.0"/><text class="mns atxt mid" x="417.0" y="229.0">review what it did</text><rect class="paper" x="12" y="264" width="125" height="34" rx="17.0"/><text class="lb  mid" x="74.5" y="286.0" style="font-size:14px">Instructions</text><rect class="paper" x="150" y="264" width="125" height="34" rx="17.0"/><text class="lb  mid" x="212.5" y="286.0" style="font-size:14px">Context</text><rect class="paper" x="288" y="264" width="125" height="34" rx="17.0"/><text class="lb  mid" x="350.5" y="286.0" style="font-size:14px">Tools</text><rect class="paper" x="426" y="264" width="125" height="34" rx="17.0"/><text class="lb  mid" x="488.5" y="286.0" style="font-size:14px">Permission</text><rect class="tg" x="14" y="324" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="352">The same prompt can end in text only, or in</text><text class="bn mid" x="280.0" y="374">changes on your disk.</text></svg>
