<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 362" width="560" height="362"><title>Four thoughts, four homes</title><desc>Four cards: a Discussion for open exploration, an issue for committed work, an ADR file for a decision already made, and a decision-needed issue for a decision still to make. An arrow shows a Discussion converting to an issue.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="362" rx="16"/><rect class="paper" x="12" y="24" width="230" height="118" rx="14"/><rect class="paper" x="24.0" y="42.0" width="56" height="36" rx="12"/><path class="paper" d="M38.0,78.0 l-6,12 l18,-12 z"/><rect class="ln" x="36.0" y="54.0" width="32" height="5" rx="2"/><rect class="ln" x="36.0" y="65.0" width="18" height="5" rx="2"/><text class="lb" x="94" y="70" style="font-size:17px">Discussion</text><text class="sm" x="28" y="110" style="font-size:14px">open exploration,</text><text class="sm" x="28" y="130" style="font-size:14px">no end state</text><rect class="tg" x="318" y="24" width="230" height="118" rx="14"/><rect class="paper" x="330" y="34" width="56" height="60" rx="6"/><rect class="tg" x="338" y="43" width="10" height="10" rx="2"/><rect class="ln" x="352" y="45" width="24" height="6" rx="3"/><rect class="tg" x="338" y="61" width="10" height="10" rx="2"/><rect class="ln" x="352" y="63" width="24" height="6" rx="3"/><rect class="tg" x="338" y="79" width="10" height="10" rx="2"/><rect class="ln" x="352" y="81" width="24" height="6" rx="3"/><text class="lb" x="400" y="70" style="font-size:17px">Issue</text><text class="sm" x="334" y="110" style="font-size:14px">committed work, with</text><text class="sm" x="334" y="130" style="font-size:14px">an owner and an end</text><rect class="ta" x="12" y="166" width="230" height="118" rx="14"/><path class="ta" d="M22,188 h20 l6,8 h34 v34 h-60 z"/><text class="lb" x="94" y="212" style="font-size:17px">ADR file</text><text class="sm" x="28" y="252" style="font-size:14px">a decision already made,</text><text class="sm" x="28" y="272" style="font-size:14px">one file, never edited</text><rect class="paper" x="318" y="166" width="230" height="118" rx="14"/><rect class="paper" x="330" y="176" width="56" height="60" rx="6"/><rect class="tg" x="338" y="185" width="10" height="10" rx="2"/><rect class="ln" x="352" y="187" width="24" height="6" rx="3"/><rect class="tg" x="338" y="203" width="10" height="10" rx="2"/><rect class="ln" x="352" y="205" width="24" height="6" rx="3"/><rect class="tg" x="338" y="221" width="10" height="10" rx="2"/><rect class="ln" x="352" y="223" width="24" height="6" rx="3"/><text class="lb" x="400" y="212" style="font-size:17px">To decide</text><text class="sm" x="334" y="252" style="font-size:14px">a decision still to make,</text><text class="sm" x="334" y="272" style="font-size:14px">tracked as an issue</text><path class="arw-g" d="M246,84 L314,84"/><text class="mns mid" x="280" y="72" style="font-size:13px">convert</text><rect class="tg" x="14" y="304" width="532" height="44" rx="12"/><text class="bn mid" x="280.0" y="332">Pick the home by what kind of thought it is.</text></svg>
