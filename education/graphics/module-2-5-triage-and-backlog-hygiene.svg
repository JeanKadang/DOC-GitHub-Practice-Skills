<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390"><title>Sort every open issue into one tray</title><desc>An open issue is sorted into one of six outcomes: already fixed, scope changed, obsolete, duplicate, unclear, or still valid. A strip notes that priority and milestone answer different questions.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="390" rx="16"/><rect class="paper" x="36.0" y="65.0" width="56" height="70" rx="6"/><rect class="ln" x="45.0" y="77.0" width="38" height="6" rx="3"/><rect class="ln" x="45.0" y="91.0" width="28" height="6" rx="3"/><rect class="ln" x="45.0" y="105.0" width="38" height="6" rx="3"/><text class="lb mid" x="64" y="156">Open</text><text class="lb mid" x="64" y="176">issue</text><path class="arw" d="M100,100 L154,100"/><rect class="tg" x="162" y="20" width="186" height="62" rx="12"/><text class="lb" x="174" y="46" style="font-size:16px">Already fixed</text><text class="sm" x="174" y="68" style="font-size:14px">close with proof</text><rect class="paper" x="360" y="20" width="186" height="62" rx="12"/><text class="lb" x="372" y="46" style="font-size:16px">Scope changed</text><text class="sm" x="372" y="68" style="font-size:14px">record why</text><rect class="paper" x="162" y="92" width="186" height="62" rx="12"/><text class="lb" x="174" y="118" style="font-size:16px">Obsolete</text><text class="sm" x="174" y="140" style="font-size:14px">close: not planned</text><rect class="paper" x="360" y="92" width="186" height="62" rx="12"/><text class="lb" x="372" y="118" style="font-size:16px">Duplicate</text><text class="sm" x="372" y="140" style="font-size:14px">merge into older</text><rect class="ta" x="162" y="164" width="186" height="62" rx="12"/><text class="lb" x="174" y="190" style="font-size:16px">Unclear</text><text class="sm" x="174" y="212" style="font-size:14px">ask the author</text><rect class="tg" x="360" y="164" width="186" height="62" rx="12"/><text class="lb" x="372" y="190" style="font-size:16px">Still valid</text><text class="sm" x="372" y="212" style="font-size:14px">priority, milestone</text><rect class="ta" x="12" y="246" width="536" height="44" rx="12"/><text class="lb mid" x="280" y="274" style="font-size:15px">Priority = how important. Milestone = which release.</text><rect class="tg" x="14" y="310" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="338">Leaving a valid issue alone is a legitimate</text><text class="bn mid" x="280.0" y="360">outcome.</text></svg>
