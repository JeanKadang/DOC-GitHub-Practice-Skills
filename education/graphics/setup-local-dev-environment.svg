<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420"><title>Set up once, then start working</title><desc>Six tiles in order: install Git, set your Git name, install VS Code, connect VS Code to GitHub, sign in to the GitHub CLI if you use it, and add the recommended extensions.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="420" rx="16"/><rect class="paper" x="12" y="24" width="170" height="134" rx="12"/><circle class="tg" cx="34" cy="46" r="13"/><text class="mn mid" x="34" y="51" style="font-size:14px">1</text><rect class="ta" x="116" y="54" width="52" height="38" rx="4"/><path class="ta" d="M116,54 l8,-14 h36 l8,14"/><rect class="paper" x="134" y="54" width="16" height="10" rx="2"/><text class="lb" x="26" y="120" style="font-size:16px">Install Git</text><rect class="paper" x="195" y="24" width="170" height="134" rx="12"/><circle class="tg" cx="217" cy="46" r="13"/><text class="mn mid" x="217" y="51" style="font-size:14px">2</text><circle class="paper" cx="325" cy="58" r="9"/><path class="paper" d="M309,86 q0,-20 16,-20 q16,0 16,20 z"/><text class="lb" x="209" y="120" style="font-size:16px">Tell Git who</text><text class="lb" x="209" y="140" style="font-size:16px">you are</text><rect class="paper" x="378" y="24" width="170" height="134" rx="12"/><circle class="tg" cx="400" cy="46" r="13"/><text class="mn mid" x="400" y="51" style="font-size:14px">3</text><rect class="paper" x="478" y="44" width="60" height="48" rx="6"/><rect class="tg" x="478" y="44" width="60" height="12" rx="6"/><rect class="ln" x="486" y="62" width="44" height="6" rx="3"/><rect class="ln" x="486" y="74" width="30" height="6" rx="3"/><text class="lb" x="392" y="120" style="font-size:16px">Install VS Code</text><rect class="paper" x="12" y="172" width="170" height="134" rx="12"/><circle class="tg" cx="34" cy="194" r="13"/><text class="mn mid" x="34" y="199" style="font-size:14px">4</text><rect class="paper" x="124" y="208" width="36" height="24" rx="6"/><path class="st" d="M133,208 v-16 M151,208 v-16"/><path class="st" d="M142,232 v14"/><text class="lb" x="26" y="268" style="font-size:16px">Connect VS Code</text><text class="lb" x="26" y="288" style="font-size:16px">to GitHub</text><rect class="paper dash" x="195" y="172" width="170" height="134" rx="12"/><circle class="tg" cx="217" cy="194" r="13"/><text class="mn mid" x="217" y="199" style="font-size:14px">5</text><rect class="paper" x="295" y="192" width="60" height="48" rx="6"/><path class="st-g" d="M305,208 l8,7 l-8,7"/><path class="st" d="M321,224 h16"/><text class="lb" x="209" y="268" style="font-size:16px">Sign in to the</text><text class="lb" x="209" y="288" style="font-size:16px">GitHub CLI</text><text class="mns" x="233" y="199" style="font-size:12px">optional</text><rect class="paper" x="378" y="172" width="170" height="134" rx="12"/><circle class="tg" cx="400" cy="194" r="13"/><text class="mn mid" x="400" y="199" style="font-size:14px">6</text><rect class="paper" x="484" y="198" width="48" height="40" rx="6"/><circle class="tg" cx="514" cy="196" r="8"/><circle class="tg" cx="534" cy="218" r="8"/><text class="lb" x="392" y="268" style="font-size:16px">Add the</text><text class="lb" x="392" y="288" style="font-size:16px">extensions</text><text class="sm mid" x="280" y="334">About 35 minutes, mostly waiting on installers.</text><rect class="tg" x="14" y="362" width="532" height="44" rx="12"/><text class="bn mid" x="280.0" y="390">Do it once, before the command-line modules.</text></svg>
