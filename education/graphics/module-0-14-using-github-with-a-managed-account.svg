<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 524" width="560" height="524"><title>Your account lives inside the company</title><desc>Five things that differ with a managed account: the account is provisioned through the company login so name and email are not editable on GitHub, public repositories and gists are not available so use internal repositories, the account cannot collaborate outside the enterprise so use a personal account if policy allows, addresses move to your enterprise subdomain so hard-coded github.com links need updating, and Marketplace actions may not work so check each one.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="524" rx="16"/><text class="mns mid" x="122" y="38" style="font-size:14px">With a managed account</text><text class="mns mid" x="419" y="38" style="font-size:14px">What it means</text><rect class="paper" x="12" y="50" width="220" height="50" rx="12"/><text class="mn" x="26" y="81" style="font-size:14px">1  Account</text><path class="arw" d="M240,75 L282,75"/><rect class="ta" x="290" y="50" width="258" height="50" rx="12"/><text class="lb" x="304" y="81" style="font-size:15px">Created by company login</text><text class="sm atxt" x="304" y="118" style="font-size:13px">name and email not editable</text><rect class="paper" x="12" y="128" width="220" height="50" rx="12"/><text class="mn" x="26" y="159" style="font-size:14px">2  Public repos, gists</text><path class="arw" d="M240,153 L282,153"/><rect class="tr" x="290" y="128" width="258" height="50" rx="12"/><text class="lb" x="304" y="159" style="font-size:15px">Not available</text><text class="sm rtxt" x="304" y="196" style="font-size:13px">use internal repositories</text><rect class="paper" x="12" y="206" width="220" height="50" rx="12"/><text class="mn" x="26" y="237" style="font-size:14px">3  Outside projects</text><path class="arw" d="M240,231 L282,231"/><rect class="tr" x="290" y="206" width="258" height="50" rx="12"/><text class="lb" x="304" y="237" style="font-size:15px">Not from this account</text><text class="sm rtxt" x="304" y="274" style="font-size:13px">personal account, if policy allows</text><rect class="paper" x="12" y="284" width="220" height="50" rx="12"/><text class="mn" x="26" y="315" style="font-size:14px">4  Addresses</text><path class="arw" d="M240,309 L282,309"/><rect class="ta" x="290" y="284" width="258" height="50" rx="12"/><text class="lb" x="304" y="315" style="font-size:15px">Your enterprise subdomain</text><text class="sm atxt" x="304" y="352" style="font-size:13px">update hard-coded github.com</text><rect class="paper" x="12" y="362" width="220" height="50" rx="12"/><text class="mn" x="26" y="393" style="font-size:14px">5  Marketplace actions</text><path class="arw" d="M240,387 L282,387"/><rect class="ta" x="290" y="362" width="258" height="50" rx="12"/><text class="lb" x="304" y="393" style="font-size:15px">May not work</text><text class="sm atxt" x="304" y="430" style="font-size:13px">check each action</text><rect class="tg" x="14" y="444" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="472">Check the account and address,</text><text class="bn mid" x="280.0" y="494">then push.</text></svg>