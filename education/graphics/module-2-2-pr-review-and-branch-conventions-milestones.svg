<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="560" height="350"><title>A milestone is a release bucket, not a sprint</title><desc>Two cards: branch names start with fix, feat or docs, one branch per issue from an up-to-date main; a milestone is a release bucket that answers what ships next, and sprint cadence belongs in a Projects iteration field.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="350" rx="16"/><rect class="paper" x="12" y="22" width="264" height="222" rx="14"/><text class="lbb" x="26" y="50" style="font-size:18px">Branches</text><rect class="tg" x="26" y="78" width="70" height="26" rx="8"/><text class="mn" x="34" y="96" style="font-size:13px">fix/</text><text class="sm" x="106" y="96" style="font-size:13px">bug fixes</text><rect class="tg" x="26" y="112" width="70" height="26" rx="8"/><text class="mn" x="34" y="130" style="font-size:13px">feat/</text><text class="sm" x="106" y="130" style="font-size:13px">new functionality</text><rect class="tg" x="26" y="146" width="70" height="26" rx="8"/><text class="mn" x="34" y="164" style="font-size:13px">docs/</text><text class="sm" x="106" y="164" style="font-size:13px">documentation only</text><text class="sm" x="26" y="192" style="font-size:14px">One branch per issue.</text><text class="sm" x="26" y="212" style="font-size:13px">Start from an updated main;</text><text class="sm" x="26" y="230" style="font-size:13px">never commit to it.</text><rect class="ta" x="288" y="22" width="260" height="222" rx="14"/><text class="lbb" x="302" y="50" style="font-size:18px">Milestone</text><text class="lb" x="302" y="82" style="font-size:15px">a release bucket:</text><text class="lb" x="302" y="104" style="font-size:15px">what ships next?</text><text class="sm" x="302" y="140" style="font-size:13px">Set when you file the issue,</text><text class="sm" x="302" y="158" style="font-size:13px">with priority and category.</text><rect class="paper" x="302" y="182" width="232" height="46" rx="10"/><text class="sm" x="314" y="202" style="font-size:13px">Sprint cadence?</text><text class="sm" x="314" y="220" style="font-size:12px">A Projects iteration field.</text><rect class="tg" x="14" y="270" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="298">A milestone answers “what ships next?”, not</text><text class="bn mid" x="280.0" y="320">“what are we doing this week?”</text></svg>
