<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" width="560" height="404"><title>Read a repository like a library</title><desc>Four cards: the code tab is the shelves, history and blame is the borrowing log, search is the card catalogue, and a pull request page is the contents page.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="404" rx="16"/><rect class="paper" x="12" y="24" width="266" height="130" rx="14"/><path class="ta" d="M20,46 h20 l6,8 h34 v34 h-60 z"/><text class="mns" x="90" y="58">Code tab</text><text class="lb" x="90" y="82" style="font-size:17px">The shelves</text><text class="sm" x="28" y="122">files, branches,</text><text class="sm" x="28" y="142">tags, releases</text><rect class="paper" x="282" y="24" width="266" height="130" rx="14"/><circle class="paper" cx="320" cy="64" r="20"/><path class="st" d="M320,53 V64 L329,70"/><text class="mns" x="360" y="58">History and blame</text><text class="lb" x="360" y="82" style="font-size:17px">The borrowing log</text><text class="sm" x="298" y="122">when and why it changed,</text><text class="sm" x="298" y="142">not who to blame</text><rect class="paper" x="12" y="168" width="266" height="130" rx="14"/><circle class="paper" cx="46" cy="204" r="17"/><path class="st" d="M59,217 L74,232"/><path class="st-g" d="M36,204 a10,10 0 0 1 10,-10"/><text class="mns" x="90" y="202">Search</text><text class="lb" x="90" y="226" style="font-size:17px">The card catalogue</text><rect class="ta" x="26" y="252" width="238" height="32" rx="8"/><text class="mns" x="36" y="273" style="font-size:13px">is:issue is:open label:bug</text><rect class="paper" x="282" y="168" width="266" height="130" rx="14"/><rect class="paper" x="300.0" y="182.0" width="40" height="52" rx="6"/><rect class="ln" x="309.0" y="194.0" width="22" height="6" rx="3"/><rect class="ln" x="309.0" y="208.0" width="12" height="6" rx="3"/><text class="mns" x="360" y="202">Pull request</text><text class="lb" x="360" y="226" style="font-size:17px">The contents page</text><text class="sm" x="298" y="266">Conversation, Commits,</text><text class="sm" x="298" y="286">Checks, Files changed</text><rect class="tg" x="14" y="324" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="352">GitHub keeps the answers. You only need to know</text><text class="bn mid" x="280.0" y="374">where to look.</text></svg>
