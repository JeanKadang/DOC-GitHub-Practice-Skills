<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368" width="560" height="368"><title>Rented runner or your own</title><desc>An event triggers a workflow, which runs jobs on a runner. A GitHub-hosted runner is a fresh machine per job and the default. A self-hosted runner needs upkeep and is a risk on public repositories.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="368" rx="16"/><rect class="paper" x="12" y="20" width="110" height="94" rx="12"/><text class="lb mid" x="67" y="46" style="font-size:16px">Event</text><text class="sm mid" x="67" y="72" style="font-size:13px">push, PR,</text><text class="sm mid" x="67" y="90" style="font-size:13px">tag, timer</text><path class="arw" d="M124,67 L152,67"/><rect class="paper" x="154" y="20" width="110" height="94" rx="12"/><text class="lb mid" x="209" y="46" style="font-size:16px">Workflow</text><text class="sm mid" x="209" y="72" style="font-size:13px">a YAML file</text><text class="sm mid" x="209" y="90" style="font-size:13px">in the repo</text><path class="arw" d="M266,67 L294,67"/><rect class="paper" x="296" y="20" width="110" height="94" rx="12"/><text class="lb mid" x="351" y="46" style="font-size:16px">Jobs</text><text class="sm mid" x="351" y="72" style="font-size:13px">one or more</text><text class="sm mid" x="351" y="90" style="font-size:13px">jobs</text><path class="arw" d="M408,67 L436,67"/><rect class="paper" x="438" y="20" width="110" height="94" rx="12"/><text class="lb mid" x="493" y="46" style="font-size:16px">Runner</text><text class="sm mid" x="493" y="72" style="font-size:13px">the machine</text><text class="sm mid" x="493" y="90" style="font-size:13px">that runs it</text><rect class="tg" x="12" y="138" width="266" height="124" rx="14"/><rect class="paper" x="24" y="154" width="56" height="24" rx="5"/><rect class="paper" x="24" y="184" width="56" height="24" rx="5"/><circle class="ln-g" cx="35" cy="166" r="3"/><circle class="ln-g" cx="35" cy="196" r="3"/><rect class="ln" x="54" y="164" width="20" height="4" rx="2"/><rect class="ln" x="54" y="194" width="20" height="4" rx="2"/><text class="lb" x="94" y="172" style="font-size:16px">GitHub-hosted</text><text class="sm" x="94" y="196" style="font-size:13px">new machine per job,</text><text class="sm" x="94" y="214" style="font-size:13px">destroyed afterward</text><rect class="paper" x="28" y="232" width="120" height="24" rx="12.0"/><text class="mns gtxt mid" x="88.0" y="249.0" style="font-size:12px">the default</text><rect class="ta" x="290" y="138" width="258" height="124" rx="14"/><rect class="paper" x="302" y="154" width="56" height="24" rx="5"/><rect class="paper" x="302" y="184" width="56" height="24" rx="5"/><circle class="ln-g" cx="313" cy="166" r="3"/><circle class="ln-g" cx="313" cy="196" r="3"/><rect class="ln" x="332" y="164" width="20" height="4" rx="2"/><rect class="ln" x="332" y="194" width="20" height="4" rx="2"/><text class="lb" x="372" y="172" style="font-size:16px">Self-hosted</text><text class="sm" x="372" y="196" style="font-size:13px">you patch and run it</text><text class="sm" x="372" y="214" style="font-size:13px">a PR can reach it</text><rect class="tr" x="306" y="232" width="226" height="24" rx="12.0"/><text class="mns rtxt mid" x="419.0" y="249.0" style="font-size:12px">a risk on public repos</text><rect class="tg" x="14" y="288" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="316">Default to GitHub-hosted. An agent’s pull</text><text class="bn mid" x="280.0" y="338">request is reviewed like any other.</text></svg>
