<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40.0 560 377.0" width="560" height="377.0"><title>Edit a photocopy, merge after review</title><desc>An original page labeled main is photocopied into a branch, edited, reviewed through a pull request, and merged back, which closes the linked issue.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="40.0" width="560" height="377.0" rx="16"/>
    <g>
      <rect class="paper" x="30" y="70" width="100" height="130" rx="8"/>
      <rect class="ln" x="46" y="92" width="68" height="7" rx="3"/><rect class="ln" x="46" y="114" width="56" height="7" rx="3"/><rect class="ln" x="46" y="136" width="64" height="7" rx="3"/><rect class="ln" x="46" y="158" width="48" height="7" rx="3"/>
    </g>
    <g>
      <rect class="paper" x="235" y="70" width="100" height="130" rx="8"/>
      <rect class="ln" x="251" y="92" width="68" height="7" rx="3"/><rect class="ln" x="251" y="114" width="56" height="7" rx="3"/>
      <rect class="ta" x="247" y="130" width="76" height="14" rx="4"/><rect class="ln" x="251" y="158" width="48" height="7" rx="3"/>
      <path class="st-a" d="M314,184 l26,-26 l8,8 l-26,26 l-11,3z" transform="translate(-6,-8)"/>
    </g>
    <g>
      <rect class="paper" x="430" y="70" width="100" height="130" rx="8"/>
      <rect class="ln" x="446" y="92" width="68" height="7" rx="3"/><rect class="ln" x="446" y="114" width="56" height="7" rx="3"/>
      <rect class="tg" x="442" y="130" width="76" height="14" rx="4"/><rect class="ln" x="446" y="158" width="48" height="7" rx="3"/>
      <circle class="tg" cx="518" cy="70" r="16"/><path class="st-g" d="M510,70 l6,6 l11,-12"/>
    </g>
    <path class="arw" d="M138,135 H226"/><text class="mns mid" x="182" y="122">branch</text>
    <path class="arw" d="M343,140 H421"/><text class="mns mid" x="382" y="108">pull</text><text class="mns mid" x="382" y="124">request</text>
    <circle class="paper" cx="382" cy="182" r="18"/><circle class="ln-g" cx="382" cy="182" r="7"/><text class="mns mid" x="382" y="222">review</text>
    <text class="lb mid" x="80" y="228">main</text><text class="sm mid" x="80" y="250">the original</text>
    <text class="lb mid" x="285" y="228">your branch</text><text class="sm mid" x="285" y="250">a photocopy</text>
    <text class="lb mid" x="480" y="228">main</text><text class="sm mid" x="480" y="250">with your change</text>
    <rect class="tg" x="360" y="272" width="190" height="38" rx="19"/><path class="st-g" d="M380,291 l6,6 l10,-12"/><text class="lb" x="406" y="297">issue closes</text>
  <rect class="tg" x="14" y="337.0" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="365.0">Work on a copy. Merge it only after someone</text><text class="bn mid" x="280.0" y="387.0">reviews it.</text></svg>
