<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 362" width="560" height="362"><title>VS Code is the hub</title><desc>A sketch of the VS Code window with four places to know: Explorer for your files, Source Control which runs your Git, Extensions, and Accounts for signing in to GitHub.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="362" rx="16"/><rect class="paper" x="12" y="22" width="536" height="236" rx="14"/><rect class="tg" x="12" y="22" width="536" height="30" rx="14"/><text class="mn" x="28" y="43">VS Code</text><rect class="paper" x="28" y="74" width="32" height="32" rx="8"/><text class="lb" x="74" y="89" style="font-size:15px">Explorer</text><text class="sm" x="74" y="106" style="font-size:13px">your files</text><rect class="tg" x="28" y="118" width="32" height="32" rx="8"/><text class="lb" x="74" y="133" style="font-size:15px">Source Control</text><text class="sm" x="74" y="150" style="font-size:13px">runs your Git</text><rect class="paper" x="28" y="162" width="32" height="32" rx="8"/><text class="lb" x="74" y="177" style="font-size:15px">Extensions</text><text class="sm" x="74" y="194" style="font-size:13px">Ctrl+Shift+X</text><rect class="paper" x="28" y="206" width="32" height="32" rx="8"/><text class="lb" x="74" y="221" style="font-size:15px">Accounts</text><text class="sm" x="74" y="238" style="font-size:13px">sign in to GitHub</text><rect class="bg" x="300" y="70" width="232" height="170" rx="10"/><rect class="ln" x="316" y="90" width="180" height="8" rx="4"/><rect class="ln" x="316" y="118" width="140" height="8" rx="4"/><rect class="ln" x="316" y="146" width="160" height="8" rx="4"/><rect class="ln" x="316" y="174" width="100" height="8" rx="4"/><rect class="ln" x="316" y="202" width="150" height="8" rx="4"/><rect class="tg" x="14" y="282" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="310">Install it once. Git and your accounts connect</text><text class="bn mid" x="280.0" y="332">to it next.</text></svg>
