<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410"><title>An issue is a labeled parcel</title><desc>An issue drawn as a shipping label with seven fields: title, body, criteria, priority, category, milestone and assignee, each with a short instruction.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="410" rx="16"/><rect class="paper" x="14" y="18" width="532" height="288" rx="14"/><rect class="ta" x="14" y="18" width="532" height="34" rx="14"/><text class="mn" x="32" y="41">ISSUE</text><text class="mn" x="36" y="78">Title</text><text class="sm" x="160" y="78">states the problem, not the fix</text><text class="mn" x="36" y="113">Body</text><text class="sm" x="160" y="113">what, where, how you found it</text><rect class="tg" x="22" y="126" width="516" height="33" rx="8"/><text class="mn" x="36" y="148">Criteria</text><text class="sm" x="160" y="148">outcomes you can check with proof</text><text class="mn" x="36" y="183">Priority</text><text class="sm" x="160" y="183">exactly one of P0 to P3</text><text class="mn" x="36" y="218">Category</text><text class="sm" x="160" y="218">at least one kind of work</text><text class="mn" x="36" y="253">Milestone</text><text class="sm" x="160" y="253">the release, set when filing</text><text class="mn" x="36" y="288">Assignee</text><text class="sm" x="160" y="288">one named owner</text><rect class="tg" x="14" y="330" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="358">Each field prevents a specific failure.</text><text class="bn mid" x="280.0" y="380">Criteria are what you close against.</text></svg>
