<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 382" width="560" height="382"><title>Protect the account before you need to</title><desc>Four steps: turn on two-factor with two or more methods, save recovery codes in a password manager, keep codes and factors to yourself, and re-register two-factor before replacing a device.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="382" rx="16"/><rect class="paper" x="12" y="22" width="536" height="58" rx="12"/><circle class="tg" cx="36" cy="51" r="12"/><text class="mn mid" x="36" y="56" style="font-size:13px">1</text><text class="lb" x="60" y="47" style="font-size:15px">Turn on two-factor, with two or more methods</text><text class="sm" x="60" y="67" style="font-size:13px">for example an authenticator app plus a passkey</text><rect class="paper" x="12" y="88" width="536" height="58" rx="12"/><circle class="tg" cx="36" cy="117" r="12"/><text class="mn mid" x="36" y="122" style="font-size:13px">2</text><text class="lb" x="60" y="113" style="font-size:15px">Save your recovery codes in a password manager</text><text class="sm" x="60" y="133" style="font-size:13px">not on the phone you might replace</text><rect class="paper" x="12" y="154" width="536" height="58" rx="12"/><circle class="tg" cx="36" cy="183" r="12"/><text class="mn mid" x="36" y="188" style="font-size:13px">3</text><text class="lb" x="60" y="179" style="font-size:15px">Keep your codes and factors to yourself</text><text class="sm" x="60" y="199" style="font-size:13px">not even with colleagues or admins</text><rect class="paper" x="12" y="220" width="536" height="58" rx="12"/><circle class="tg" cx="36" cy="249" r="12"/><text class="mn mid" x="36" y="254" style="font-size:13px">4</text><text class="lb" x="60" y="245" style="font-size:15px">Replacing a device? Re-register two-factor first</text><text class="sm" x="60" y="265" style="font-size:13px">it does not carry over by itself</text><rect class="tg" x="14" y="302" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="330">GitHub Support cannot restore a two-factor</text><text class="bn mid" x="280.0" y="352">account if you lose your credentials.</text></svg>
