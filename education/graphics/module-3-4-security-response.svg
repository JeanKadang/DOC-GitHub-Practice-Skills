<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 394" width="560" height="394"><title>Report it through the private door</title><desc>A public issue or pull request is crossed out because filing it is itself a disclosure. Private vulnerability reporting is the right door. Say where the secret was, not its value. Order: rotate, report privately, clean up.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="394" rx="16"/><rect class="tr" x="12" y="22" width="266" height="124" rx="14"/><circle class="tr" cx="48" cy="58" r="16"/><path class="st-r" d="M41.6,51.6 L54.4,64.4 M54.4,51.6 L41.6,64.4"/><text class="lb" x="76" y="64" style="font-size:16px">Public issue or PR</text><text class="sm" x="28" y="104">filing it is itself</text><text class="sm" x="28" y="124">a disclosure</text><rect class="tg" x="290" y="22" width="258" height="124" rx="14"/><path class="st" d="M317,48 v-8 a9,9 0 0 1 18,0 v8"/><rect class="paper" x="310" y="48" width="32" height="26" rx="5"/><circle class="paper" cx="326" cy="60" r="3.5"/><text class="lb" x="354" y="64" style="font-size:16px">Private report</text><text class="sm" x="306" y="104">GitHub’s private</text><text class="sm" x="306" y="124">vulnerability reporting</text><text class="sm mid" x="280" y="176">Say where it was, not what it was:</text><rect class="tg" x="30" y="188" width="240" height="34" rx="17.0"/><text class="mn gtxt mid" x="150.0" y="210.0">config.js, line 12</text><rect class="tr" x="290" y="188" width="240" height="34" rx="17.0"/><text class="mn rtxt mid" x="410.0" y="210.0">the secret’s value</text><rect class="tg" x="12" y="244" width="168" height="48" rx="12"/><text class="lb" x="26" y="274" style="font-size:15px">1  Rotate it</text><path class="arw" d="M182,268 L194,268"/><rect class="paper" x="196" y="244" width="168" height="48" rx="12"/><text class="lb" x="210" y="274" style="font-size:15px">2  Report</text><path class="arw" d="M366,268 L378,268"/><rect class="paper" x="380" y="244" width="168" height="48" rx="12"/><text class="lb" x="394" y="274" style="font-size:15px">3  Clean up</text><rect class="tg" x="14" y="314" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="342">Rotate first, report privately, never paste the</text><text class="bn mid" x="280.0" y="364">value.</text></svg>
