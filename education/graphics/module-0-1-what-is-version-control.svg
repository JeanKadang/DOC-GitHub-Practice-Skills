<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342" width="560" height="342"><title>One history, not ten copies</title><desc>Without version control a document turns into files named final, final v2 and final v2 real. With it, one line of saved changes, with a branch for a new intro that is merged back.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="342" rx="16"/><rect class="paper" x="12" y="22" width="224" height="214" rx="14"/><text class="sm" x="26" y="48" style="font-size:14px">Without version control</text><rect class="tr" x="24" y="66" width="200" height="34" rx="8"/><text class="mns" x="32" y="88" style="font-size:11px">report_final.docx</text><circle class="tr" cx="210" cy="83" r="9"/><path class="st-r" d="M206.4,79.4 L213.6,86.6 M213.6,79.4 L206.4,86.6"/><rect class="tr" x="24" y="112" width="200" height="34" rx="8"/><text class="mns" x="32" y="134" style="font-size:11px">report_final_v2.docx</text><circle class="tr" cx="210" cy="129" r="9"/><path class="st-r" d="M206.4,125.4 L213.6,132.6 M213.6,125.4 L206.4,132.6"/><rect class="tr" x="24" y="158" width="200" height="34" rx="8"/><text class="mns" x="32" y="180" style="font-size:11px">report_final_v2_REAL.docx</text><circle class="tr" cx="210" cy="175" r="9"/><path class="st-r" d="M206.4,171.4 L213.6,178.6 M213.6,171.4 L206.4,178.6"/><rect class="paper" x="248" y="22" width="300" height="214" rx="14"/><text class="sm" x="262" y="48" style="font-size:14px">With version control</text><path class="st" d="M270,170 H526"/><path class="st-g" d="M350,170 Q362,110 410,110 H440 Q490,110 500,170"/><circle class="tg" cx="284" cy="170" r="9"/><text class="sm mid" x="284" y="198" style="font-size:13px">draft</text><circle class="tg" cx="350" cy="170" r="9"/><text class="sm mid" x="350" y="198" style="font-size:13px">chapter 2</text><circle class="tg" cx="500" cy="170" r="9"/><text class="sm mid" x="500" y="198" style="font-size:13px">merged</text><circle class="ta" cx="425" cy="110" r="9"/><text class="sm mid" x="425" y="92" style="font-size:13px">new intro</text><text class="sm mid" x="398" y="224" style="font-size:13px">every change kept, with a message</text><rect class="tg" x="14" y="262" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="290">One history of every change beats ten copies of</text><text class="bn mid" x="280.0" y="312">the same file.</text></svg>
