<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 388" width="560" height="388"><title>Sort a tool by what it does</title><desc>Four rows: an IDE or editor such as VS Code, an AI assistant such as ChatGPT or Claude, an AI coding assistant such as GitHub Copilot, and an AI development agent such as Claude Code or Codex, which does the task itself so you review what it did.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="388" rx="16"/><rect class="paper" x="12" y="22" width="536" height="58" rx="12"/><text class="lb" x="26" y="47" style="font-size:15px">IDE or editor</text><text class="mns" x="26" y="69" style="font-size:13px">VS Code</text><text class="sm" x="232" y="58" style="font-size:14px">where you write and run things</text><rect class="paper" x="12" y="90" width="536" height="58" rx="12"/><text class="lb" x="26" y="115" style="font-size:15px">AI assistant</text><text class="mns" x="26" y="137" style="font-size:13px">ChatGPT, Claude</text><text class="sm" x="232" y="126" style="font-size:14px">answers and drafts text</text><rect class="tg" x="12" y="158" width="536" height="58" rx="12"/><text class="lb" x="26" y="183" style="font-size:15px">AI coding assistant</text><text class="mns" x="26" y="205" style="font-size:13px">GitHub Copilot</text><text class="sm" x="232" y="194" style="font-size:14px">helps while you write code</text><rect class="ta" x="12" y="226" width="536" height="58" rx="12"/><text class="lb" x="26" y="251" style="font-size:15px">AI development agent</text><text class="mns" x="26" y="273" style="font-size:13px">Claude Code, Codex</text><text class="sm" x="232" y="262" style="font-size:14px">does the task itself</text><text class="sm atxt" x="232" y="278" style="font-size:12px">so you review what it did</text><rect class="tg" x="14" y="308" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="336">Classify a tool by what it does, not by where</text><text class="bn mid" x="280.0" y="358">it runs.</text></svg>
