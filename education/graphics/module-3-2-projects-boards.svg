<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 382" width="560" height="382"><title>The board is a window onto issues</title><desc>Issues on the left are the source of truth and the board on the right mirrors them. If an issue label says P1 and the board field says P2, the label wins and the field is fixed.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="382" rx="16"/><rect class="paper" x="12" y="24" width="222" height="150" rx="14"/><text class="lbb" x="28" y="52">Issues</text><text class="sm" x="112" y="52" style="font-size:12px">source of truth</text><rect class="tg" x="26" y="66" width="194" height="28" rx="7"/><text class="mn" x="36" y="85" style="font-size:13px">#12</text><rect class="paper" x="170" y="70" width="40" height="20" rx="10.0"/><text class="mns  mid" x="190.0" y="85.0" style="font-size:12px">P1</text><rect class="tg" x="26" y="100" width="194" height="28" rx="7"/><text class="mn" x="36" y="119" style="font-size:13px">#13</text><rect class="paper" x="170" y="104" width="40" height="20" rx="10.0"/><text class="mns  mid" x="190.0" y="119.0" style="font-size:12px">P2</text><rect class="tg" x="26" y="134" width="194" height="28" rx="7"/><text class="mn" x="36" y="153" style="font-size:13px">#14</text><rect class="paper" x="170" y="138" width="40" height="20" rx="10.0"/><text class="mns  mid" x="190.0" y="153.0" style="font-size:12px">P1</text><path class="arw" d="M240,100 L322,100"/><text class="mns mid" x="281" y="90" style="font-size:12px">mirrors</text><rect class="paper" x="326" y="24" width="222" height="150" rx="14"/><text class="lbb" x="342" y="52">Board</text><text class="sm" x="412" y="52" style="font-size:12px">a view over them</text><rect class="ln" x="340" y="66" width="60" height="94" rx="8" fill-opacity=".35"/><text class="mns mid" x="370" y="82" style="font-size:11px">To do</text><rect class="tg" x="346" y="90" width="48" height="16" rx="4"/><rect class="tg" x="346" y="112" width="48" height="16" rx="4"/><rect class="ln" x="406" y="66" width="60" height="94" rx="8" fill-opacity=".35"/><text class="mns mid" x="436" y="82" style="font-size:11px">Doing</text><rect class="paper" x="412" y="90" width="48" height="16" rx="4"/><rect class="ln" x="472" y="66" width="60" height="94" rx="8" fill-opacity=".35"/><text class="mns mid" x="502" y="82" style="font-size:11px">Done</text><rect class="paper" x="478" y="90" width="48" height="16" rx="4"/><rect class="tg" x="46" y="198" width="200" height="38" rx="19.0"/><text class="lb gtxt mid" x="146.0" y="222.0" style="font-size:16px">Issue label: P1</text><text class="lbb mid" x="280" y="223">≠</text><rect class="tr" x="314" y="198" width="200" height="38" rx="19.0"/><text class="lb rtxt mid" x="414.0" y="222.0" style="font-size:16px">Board field: P2</text><text class="lb mid" x="280" y="270" style="font-size:16px">When they disagree, the label wins. Fix the field.</text><rect class="tg" x="14" y="302" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="330">A board is a view over issues, never the source</text><text class="bn mid" x="280.0" y="352">of truth.</text></svg>
