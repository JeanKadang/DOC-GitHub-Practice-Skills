<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 408" width="560" height="408"><title>Each rule exists to stop one mistake</title><desc>Six rule cards, each with what goes wrong if it is skipped: audit the issue after merge, read a red check before re-running, never approve your own pull request, branch before committing, rotate a leaked secret first, and give evidence for every criterion.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="408" rx="16"/><rect class="paper" x="12" y="22" width="170" height="138" rx="14"/><text class="lb" x="26" y="50" style="font-size:15px">Audit the issue</text><text class="lb" x="26" y="70" style="font-size:15px">after every merge</text><path class="st dash" d="M26,84 H168"/><text class="mns rtxt" x="26" y="104" style="font-size:12px">if skipped</text><text class="sm" x="26" y="124" style="font-size:14px">closes with a</text><text class="sm" x="26" y="142" style="font-size:14px">criterion unmet</text><rect class="paper" x="195" y="22" width="170" height="138" rx="14"/><text class="lb" x="209" y="50" style="font-size:15px">Read a red check</text><text class="lb" x="209" y="70" style="font-size:15px">before re-running</text><path class="st dash" d="M209,84 H351"/><text class="mns rtxt" x="209" y="104" style="font-size:12px">if skipped</text><text class="sm" x="209" y="124" style="font-size:14px">a real defect is</text><text class="sm" x="209" y="142" style="font-size:14px">re-run until green</text><rect class="paper" x="378" y="22" width="170" height="138" rx="14"/><text class="lb" x="392" y="50" style="font-size:15px">Never approve</text><text class="lb" x="392" y="70" style="font-size:15px">your own PR</text><path class="st dash" d="M392,84 H534"/><text class="mns rtxt" x="392" y="104" style="font-size:12px">if skipped</text><text class="sm" x="392" y="124" style="font-size:14px">review exists on</text><text class="sm" x="392" y="142" style="font-size:14px">paper only</text><rect class="paper" x="12" y="170" width="170" height="138" rx="14"/><text class="lb" x="26" y="198" style="font-size:15px">Branch before</text><text class="lb" x="26" y="218" style="font-size:15px">committing</text><path class="st dash" d="M26,232 H168"/><text class="mns rtxt" x="26" y="252" style="font-size:12px">if skipped</text><text class="sm" x="26" y="272" style="font-size:14px">unreviewed work</text><text class="sm" x="26" y="290" style="font-size:14px">lands on main</text><rect class="paper" x="195" y="170" width="170" height="138" rx="14"/><text class="lb" x="209" y="198" style="font-size:15px">Rotate a leaked</text><text class="lb" x="209" y="218" style="font-size:15px">secret first</text><path class="st dash" d="M209,232 H351"/><text class="mns rtxt" x="209" y="252" style="font-size:12px">if skipped</text><text class="sm" x="209" y="272" style="font-size:14px">a live credential</text><text class="sm" x="209" y="290" style="font-size:14px">stays exposed</text><rect class="paper" x="378" y="170" width="170" height="138" rx="14"/><text class="lb" x="392" y="198" style="font-size:15px">Evidence for</text><text class="lb" x="392" y="218" style="font-size:15px">every criterion</text><path class="st dash" d="M392,232 H534"/><text class="mns rtxt" x="392" y="252" style="font-size:12px">if skipped</text><text class="sm" x="392" y="272" style="font-size:14px">“done” means</text><text class="sm" x="392" y="290" style="font-size:14px">nobody checked</text><rect class="tg" x="14" y="328" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="356">Know the mistake behind a rule and you can</text><text class="bn mid" x="280.0" y="378">judge when a lighter process is fine.</text></svg>
