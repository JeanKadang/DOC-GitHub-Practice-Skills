<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 374" width="560" height="374"><title>Write for someone who was not there</title><desc>An issue body drawn as a form with a heading, a code block, a task list and a collapsed section, each annotated with why it helps the reader.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="374" rx="16"/><rect class="paper" x="14" y="20" width="350" height="272" rx="14"/><text class="mn" x="30" y="50">## What is wrong</text><rect class="ln" x="30" y="64" width="280" height="7" rx="3"/><rect class="ln" x="30" y="80" width="210" height="7" rx="3"/><path class="st dash" d="M26,102 H352"/><text class="mn" x="30" y="118">## Steps to reproduce</text><rect class="ta" x="30" y="130" width="200" height="30" rx="6"/><text class="mn" x="40" y="150">npm run check</text><path class="st dash" d="M26,170 H352"/><text class="mn" x="30" y="186">## Acceptance criteria</text><rect class="tg" x="30" y="196" width="14" height="14" rx="3"/><rect class="ln" x="54" y="200" width="150" height="7" rx="3"/><rect class="paper" x="30" y="218" width="14" height="14" rx="3"/><rect class="ln" x="54" y="222" width="120" height="7" rx="3"/><path class="st dash" d="M26,238 H352"/><text class="mn" x="30" y="254">▶ Full log (collapsed)</text><path class="arw" d="M372,60 L392,60"/><text class="sm" x="400" y="60">headings to</text><text class="sm" x="400" y="80">scan fast</text><path class="arw" d="M372,128 L392,128"/><text class="sm" x="400" y="128">code fences</text><text class="sm" x="400" y="148">keep it exact</text><path class="arw" d="M372,196 L392,196"/><text class="sm" x="400" y="196">task lists</text><text class="sm" x="400" y="216">to tick off</text><path class="arw" d="M372,258 L392,258"/><text class="sm" x="400" y="258">collapsible</text><text class="sm" x="400" y="278">hides long logs</text><rect class="tg" x="14" y="316" width="532" height="44" rx="12"/><text class="bn mid" x="280.0" y="344">Preview before you submit.</text></svg>
