<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 394" width="560" height="394"><title>Approving is not merging</title><desc>Author, reviewer and maintainer. The reviewer gives an Approved stamp and the maintainer gives a separate Merged stamp. Below, Request changes is a real blocker and Comment gives no verdict.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="394" rx="16"/><circle class="paper" cx="95" cy="60" r="9"/><path class="paper" d="M79,88 q0,-20 16,-20 q16,0 16,20 z"/><text class="lb mid" x="95" y="118">Author</text><circle class="paper" cx="280" cy="60" r="9"/><path class="paper" d="M264,88 q0,-20 16,-20 q16,0 16,20 z"/><text class="lb mid" x="280" y="118">Reviewer</text><circle class="paper" cx="465" cy="60" r="9"/><path class="paper" d="M449,88 q0,-20 16,-20 q16,0 16,20 z"/><text class="lb mid" x="465" y="118">Maintainer</text><path class="arw" d="M135,66 L238,66"/><text class="mns mid" x="186" y="54">Refs #N</text><path class="arw" d="M322,66 L424,66"/><text class="mns mid" x="373" y="54">approved</text><rect class="tg" x="205" y="132" width="150" height="30" rx="15.0"/><text class="mns gtxt mid" x="280.0" y="152.0">Approved</text><rect class="tg" x="390" y="132" width="150" height="30" rx="15.0"/><text class="mns gtxt mid" x="465.0" y="152.0">Merged</text><text class="sm mid" x="280" y="186">“this change is good”</text><text class="sm mid" x="465" y="186">“now is the time”</text><path class="st dash" d="M335,150 H380"/><rect class="tr" x="12" y="214" width="266" height="76" rx="14"/><text class="lb" x="28" y="244">Request changes</text><text class="sm" x="28" y="270">a real blocker</text><rect class="paper" x="290" y="214" width="258" height="76" rx="14"/><text class="lb" x="306" y="244">Comment</text><text class="sm" x="306" y="270">thoughts, no verdict</text><rect class="tg" x="14" y="314" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="342">Never approve your own pull request to get past</text><text class="bn mid" x="280.0" y="364">a rule.</text></svg>
