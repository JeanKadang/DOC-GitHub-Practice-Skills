<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0.0 560 432.0" width="560" height="432.0"><title>House rules, recipe cards, a delivery hatch</title><desc>An instruction file is a poster on the wall, always read. A skill is a recipe card pulled out when the dish matches. An MCP server is a hatch to another kitchen and runs code, so review it first.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0.0" width="560" height="432.0" rx="16"/>
    <rect class="paper" x="12" y="20" width="170" height="300" rx="14"/>
    <rect class="paper" x="195" y="20" width="170" height="300" rx="14"/>
    <rect class="paper" x="378" y="20" width="170" height="300" rx="14"/>
    <!-- poster -->
    <rect class="ta" x="57" y="48" width="80" height="92" rx="4"/><rect class="paper" x="67" y="58" width="60" height="14" rx="3"/>
    <rect class="ln" x="67" y="84" width="60" height="6" rx="3"/><rect class="ln" x="67" y="100" width="46" height="6" rx="3"/><rect class="ln" x="67" y="116" width="54" height="6" rx="3"/>
    <text class="lb mid" x="97" y="176">Instruction file</text>
    <text class="sm mid" x="97" y="204">always on the wall</text>
    <rect class="paper" x="32" y="256" width="130" height="34" rx="17"/><text class="mns mid" x="97" y="278">text it reads</text>
    <!-- recipe card -->
    <rect class="tg" x="235" y="64" width="90" height="64" rx="6" transform="rotate(-6 280 96)"/>
    <rect class="ln" x="247" y="78" width="60" height="6" rx="3" transform="rotate(-6 280 96)"/><rect class="ln" x="247" y="94" width="48" height="6" rx="3" transform="rotate(-6 280 96)"/>
    <text class="lb mid" x="280" y="176">Skill</text>
    <text class="sm mid" x="280" y="204">a recipe card, used</text><text class="sm mid" x="280" y="224">if the dish matches</text>
    <rect class="paper" x="215" y="256" width="130" height="34" rx="17"/><text class="mns mid" x="280" y="278">text it reads</text>
    <!-- hatch -->
    <rect class="tr" x="428" y="58" width="70" height="72" rx="6"/><rect class="paper" x="442" y="76" width="42" height="36" rx="3"/>
    <path class="arw" d="M416,94 H436"/><path class="st-r" d="M492,94 h18"/>
    <text class="lb mid" x="463" y="176">MCP server</text>
    <text class="sm mid" x="463" y="204">a hatch to another</text><text class="sm mid" x="463" y="224">kitchen</text>
    <rect class="tr" x="398" y="256" width="130" height="34" rx="17"/><text class="mns mid rtxt" x="463" y="278">code that runs</text>
  <rect class="tg" x="14" y="352.0" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="380.0">Two are text it reads. One is code that acts,</text><text class="bn mid" x="280.0" y="402.0">so review it first.</text></svg>
