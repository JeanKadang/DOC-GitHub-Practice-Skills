<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0.0 560 432.0" width="560" height="432.0"><title>Three undos, three different jobs</title><desc>Three undo commands: restore is a pencil eraser and the edit is gone, revert is a void slip that adds a correction and is safe to share, reset tears out pages and rewrites history.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0.0" width="560" height="432.0" rx="16"/>
    <rect class="paper" x="12" y="20" width="170" height="300" rx="14"/>
    <rect class="paper" x="195" y="20" width="170" height="300" rx="14"/>
    <rect class="paper" x="378" y="20" width="170" height="300" rx="14"/>
    <!-- eraser -->
    <g transform="rotate(-25 97 85)"><rect class="tr" x="62" y="64" width="70" height="38" rx="8"/><rect class="paper" x="62" y="64" width="26" height="38" rx="8"/></g>
    <path class="st dash" d="M52,120 H140"/>
    <text class="mn mid" x="97" y="170">git restore</text>
    <text class="sm mid" x="97" y="204">an unsaved edit</text><text class="sm mid" x="97" y="224">is gone for good</text>
    <rect class="tr" x="37" y="256" width="120" height="34" rx="17"/><text class="mns mid rtxt" x="97" y="278">no way back</text>
    <!-- void slip -->
    <rect class="paper" x="240" y="56" width="80" height="76" rx="6"/>
    <rect class="ln" x="252" y="70" width="56" height="6" rx="3"/><rect class="ln" x="252" y="86" width="40" height="6" rx="3"/>
    <g transform="rotate(-14 280 108)"><rect class="tg" x="250" y="96" width="60" height="26" rx="5"/><text class="mns mid gtxt" x="280" y="114">VOID</text></g>
    <text class="mn mid" x="280" y="170">git revert</text>
    <text class="sm mid" x="280" y="204">adds a correcting</text><text class="sm mid" x="280" y="224">commit on top</text>
    <rect class="tg" x="220" y="256" width="120" height="34" rx="17"/><text class="mns mid gtxt" x="280" y="278">safe to share</text>
    <!-- torn pages -->
    <path class="paper" d="M425,60 h80 v20 l-8,6 l8,6 l-8,6 l8,6 v22 h-80z"/>
    <rect class="ln" x="437" y="70" width="48" height="6" rx="3"/><rect class="ln" x="437" y="116" width="56" height="6" rx="3"/>
    <path class="st-r dash" d="M420,104 H512"/>
    <text class="mn mid" x="463" y="170">git reset</text>
    <text class="sm mid" x="463" y="204">moves the branch</text><text class="sm mid" x="463" y="224">back in time</text>
    <rect class="ta" x="398" y="256" width="130" height="34" rx="17"/><text class="mns mid atxt" x="463" y="278">alters history</text>
  <rect class="tg" x="14" y="352.0" width="532" height="66" rx="12"/><text class="bn mid" x="280.0" y="380.0">Choose by what you are undoing, and who already</text><text class="bn mid" x="280.0" y="402.0">has it.</text></svg>
