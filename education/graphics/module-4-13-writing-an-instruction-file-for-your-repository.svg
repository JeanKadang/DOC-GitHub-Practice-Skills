<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 458" width="560" height="458"><title>What goes in an instruction file</title><desc>What belongs in an instruction file and what does not. In: the test command, conventions such as names and commit format, off-limits paths, and where things live. Out: secrets, long policy that belongs in a skill, weekly news that goes stale, and anything CI enforces, because a file only steers an assistant.</desc><style>svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.bg { fill: #f4f6f2; }
.paper { fill: #ffffff; stroke: #c9d1cc; stroke-width: 2; }
.tg { fill: #dcf1e7; stroke: #1c8a63; stroke-width: 2; }
.ta { fill: #fbecc9; stroke: #b87a0d; stroke-width: 2; }
.tr { fill: #f9dcd6; stroke: #c24a38; stroke-width: 2; }
.ln { fill: #c9d1cc; }
.ln-g { fill: #1c8a63; }
.st { stroke: #56625c; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-g { stroke: #1c8a63; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-r { stroke: #c24a38; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.st-a { stroke: #b87a0d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 6 6; }
.arw { stroke: #56625c; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
.arw-g { stroke: #1c8a63; stroke-width: 3; fill: none; marker-end: url(#arg); }
.mk { fill: #56625c; } .mkg { fill: #1c8a63; }
text { fill: #15201c; }
.lb { font-size: 18px; font-weight: 500; }
.lbb { font-size: 20px; font-weight: 700; }
.bn { font-size: 17px; font-weight: 600; }
.sm { font-size: 15px; fill: #56625c; }
.mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; }
.mns { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #56625c; }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.gtxt { fill: #1c8a63; } .atxt { fill: #b87a0d; } .rtxt { fill: #c24a38; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #121816; }
  .paper { fill: #1b2321; stroke: #3a4741; }
  .tg { fill: #173a2d; stroke: #4cc79b; }
  .ta { fill: #3d2f11; stroke: #e5a53b; }
  .tr { fill: #402019; stroke: #ef7d6b; }
  .ln { fill: #3a4741; }
  .ln-g { fill: #4cc79b; }
  .st { stroke: #a2aea8; }
  .st-g { stroke: #4cc79b; }
  .st-r { stroke: #ef7d6b; }
  .st-a { stroke: #e5a53b; }
  .arw { stroke: #a2aea8; }
  .arw-g { stroke: #4cc79b; }
  .mk { fill: #a2aea8; } .mkg { fill: #4cc79b; }
  text { fill: #f1f5f2; }
  .sm, .mns { fill: #a2aea8; }
  .gtxt { fill: #4cc79b; } .atxt { fill: #e5a53b; } .rtxt { fill: #ef7d6b; }
}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkg" d="M0,0 L10,5 L0,10z"/></marker></defs><rect class="bg" x="0" y="0" width="560" height="458" rx="16"/><text class="lb mid" style="font-weight:700" x="132" y="24">Put in the file</text><text class="lb mid" style="font-weight:700" x="428" y="24">Keep out</text><rect class="tg" x="14" y="40" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="70">test command</text><text class="sm mid" x="132" y="94">how to run the checks</text><rect class="tr" x="310" y="40" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="70">secrets</text><text class="sm mid" x="428" y="94">never in the file</text><rect class="tg" x="14" y="122" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="152">conventions</text><text class="sm mid" x="132" y="176">names, commit format</text><rect class="tr" x="310" y="122" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="152">long policy</text><text class="sm mid" x="428" y="176">make it a skill</text><rect class="tg" x="14" y="204" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="234">off-limits paths</text><text class="sm mid" x="132" y="258">what not to edit</text><rect class="tr" x="310" y="204" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="234">weekly news</text><text class="sm mid" x="428" y="258">it goes stale</text><rect class="tg" x="14" y="286" width="236" height="72" rx="12"/><text class="mn mid" x="132" y="316">where things live</text><text class="sm mid" x="132" y="340">folders and files</text><rect class="tr" x="310" y="286" width="236" height="72" rx="12"/><text class="mn mid" x="428" y="316">what CI enforces</text><text class="sm mid" x="428" y="340">a file only steers</text><rect class="tg" x="14" y="378" width="532" height="66" rx="12"/><text class="bn mid" x="280" y="406">Facts go in. Secrets, procedures and weekly</text><text class="bn mid" x="280" y="428">news stay out.</text></svg>
