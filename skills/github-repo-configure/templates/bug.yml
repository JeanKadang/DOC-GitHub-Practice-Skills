name: Bug report
description: Report a reproducible defect
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened. A maintainer turns this into acceptance criteria when triaging.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, and the relevant tool(s) and version(s) involved.
      placeholder: |
        OS:
        Tool/version:
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How much does this affect real work right now?
      options:
        - Blocks work
        - Degrades work
        - Cosmetic
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else relevant. Optional.
    validations:
      required: false
