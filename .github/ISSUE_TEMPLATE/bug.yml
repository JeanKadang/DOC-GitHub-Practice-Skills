name: Bug report
description: Report a reproducible defect in a skill, installer, or validation
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities here. Use the private security route in
        SECURITY.md.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproduction
      description: Describe what happened, where, and the smallest reproduction.
      placeholder: Include commands, output, file paths, or screenshots with private data removed.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is affected and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and the evidence that can verify each one.
      placeholder: "- [ ] A focused test reproduces the defect before the fix and passes after it."
    validations:
      required: true
  - type: dropdown
    id: skills
    attributes:
      label: Affected skills
      description: Select every skill known to be affected.
      multiple: true
      options:
        - github-issue-first
        - github-hygiene
        - github-pr-review
        - github-repo-review
        - github-repo-bootstrap
        - github-security-response
        - github-projects
        - github-for-ado-users
        - Installer, validation, or documentation only
    validations:
      required: true
  - type: checkboxes
    id: public_content
    attributes:
      label: Public repository confirmation
      options:
        - label: I removed credentials, private URLs, personal data, workplace content, and other non-public material.
          required: true
