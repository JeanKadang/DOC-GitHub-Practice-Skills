name: Release tagged version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Verify tag and manifest versions
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $inventoryVersion = (Get-Content contracts/skill-inventory.json -Raw | ConvertFrom-Json).packageVersion
          if ($packageVersion -ne $tagVersion) {
            throw "package.json version '$packageVersion' does not match tag '$tagVersion'."
          }
          if ($inventoryVersion -ne $tagVersion) {
            throw "Inventory version '$inventoryVersion' does not match tag '$tagVersion'."
          }
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
