name: Closure audit

# Weekly, report-only audit (#115, #243): issues closed as completed that still
# have an unchecked acceptance criterion, and milestone consistency (open issues
# with no milestone, empty open milestones, closed milestones with open issues).
# It rewrites one tracking issue and never reopens, edits, closes, or assigns any
# other issue or milestone. A red result is never expected: the report is the
# output, and the maintainer owns each row (docs/MAINTAINING.md, "Closure audit").

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closure-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Closure audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_TITLE: "Repository audit: closure evidence and milestone consistency"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the report
        run: |
          gh issue list --state closed --limit 1000 \
            --json number,title,body,stateReason,closedAt,labels > closed.json
          gh issue list --state open --limit 1000 \
            --json number,title,milestone,author > open.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/milestones?state=all" > milestones.json
          node scripts/closure-audit.mjs "$(date -u +%F)" \
            --closed closed.json --open open.json --milestones milestones.json > report.md
      - name: Update the single tracking issue
        run: |
          existing="$(gh issue list --state open --search "\"$REPORT_TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$REPORT_TITLE\"))[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "$REPORT_TITLE" --body-file report.md
          fi
