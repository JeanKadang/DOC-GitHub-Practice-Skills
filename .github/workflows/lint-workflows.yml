name: Lint workflows

# Static checks for the workflow files themselves: actionlint for syntax and
# expression mistakes, zizmor for security problems such as stored credentials,
# cache poisoning, and unsafe triggers (#132). Runs only when a workflow changes.
# This check is advisory, so a workflow-only path filter cannot orphan a required
# check (see docs/MAINTAINING.md, "Required status checks").

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Third-party tools are installed from pinned versions and, for the binary,
      # a checked SHA-256, because the repository allows only GitHub-owned actions.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
      - name: Run actionlint
        run: ./actionlint -color
      - name: Install zizmor
        run: python3 -m pip install --user "zizmor==1.30.1"
      - name: Run zizmor
        run: python3 -m zizmor --no-progress .github/workflows
