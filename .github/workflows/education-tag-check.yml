name: Education tag check

on:
  push:
    tags:
      - 'education-v*'

permissions:
  contents: read

jobs:
  lint-education:
    name: Lint education/ content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
          # No dependency cache on a tag-triggered run: a poisoned cache could
          # reach whatever this workflow later publishes (zizmor cache-poisoning).
      - name: Install dependencies
        run: npm ci
      - name: Lint education/ markdown
        run: npm run lint:markdown:education
